name: Android CI & Dual-APK Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Decode Release Keystore (if configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build Release APK (R8)
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && '../release.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Upload Debug & Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseASMR-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Prepare Release Notes (v1.4.3 Format)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -f "RELEASE_NODE.md" ]; then
            cp RELEASE_NODE.md release_body.md
          elif [ -f "RELEASE_NOTES.md" ]; then
            cp RELEASE_NOTES.md release_body.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
            RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"
            FEATS=$(git log "$RANGE" --pretty=format:"* %s" --grep="^feat" || true)
            FIXES=$(git log "$RANGE" --pretty=format:"* %s" --grep="^fix" || true)
            IMPROVS=$(git log "$RANGE" --pretty=format:"* %s" --grep="^refactor\|^perf\|^chore\|^build\|^ci" || true)

            {
              echo "## What's New"
              echo ""
              if [ -n "$FEATS" ]; then echo "$FEATS"; else echo "* Release ${GITHUB_REF_NAME}"; fi
              echo ""
              echo "---"
              echo ""
              echo "## Bug Fixes"
              echo ""
              if [ -n "$FIXES" ]; then echo "$FIXES"; else echo "* General stability improvements"; fi
              echo ""
              echo "---"
              echo ""
              echo "## Improvements"
              echo ""
              if [ -n "$IMPROVS" ]; then echo "$IMPROVS"; else echo "* Updated build & performance optimizations"; fi
            } > release_body.md
          fi

      - name: Publish Dual-Channel GitHub Release (Debug + Release APKs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "JapaneseASMR ${GITHUB_REF_NAME}"
          draft: true
          body_path: release_body.md
          files: |
            app/build/outputs/apk/debug/*-debug.apk
            app/build/outputs/apk/release/*.apk
